ksp = "2.3.6"

# AndroidX
appcompat = "1.7.1"
material = "1.14.0"
recyclerview = "1.4.0"
constraintlayout = "2.2.1"
cardview = "1.0.0"
viewpager = "1.1.0"
core-ktx = "1.15.0"
activity-ktx = "1.13.0"
fragment-ktx = "1.8.9"

# Architecture Components (AndroidX)
lifecycle = "2.10.0"
room = "2.8.4"

# DI
koin = "4.2.2"

# Facebook
facebook-android-sdk = "18.2.3"
facebook-rebound = "0.3.8"

# Firebase (Modern versions)
firebase-bom = "34.15.0"
firebase-crashlytics-plugin = "3.0.7"

# Google
gms-play-services-auth = "21.6.0"
credentials = "1.6.0"
googleid = "1.2.0"
gson = "2.14.0"
youtube-api = "v3-rev20260430-2.0.0"
