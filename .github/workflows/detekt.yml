name: Detekt

on:
  push:
    branches:
      - release/2606.0.0
      - release/**
  pull_request:
    branches:
      - release/2606.0.0
  workflow_dispatch:
  schedule:
    - cron: "16 11 * * 3"

jobs:
  detekt:
    name: Detekt
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt
        run: ./gradlew :app:detekt
